<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JIT Access Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert-success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .greeting {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .timer {
            text-align: center;
            font-size: 24px;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            color: #666;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 JIT Access Portal</h1>
        <p class="subtitle">Just-In-Time Access Management</p>

        <div id="loading" class="loading">
            Loading...
        </div>

        <div id="error-alert" class="alert alert-error hidden"></div>
        <div id="success-alert" class="alert alert-success hidden"></div>

        <!-- State 1: Request Screen -->
        <div id="request-screen" class="hidden">
            <div class="greeting" id="greeting"></div>

            <label for="resource-select">Select Resource:</label>
            <select id="resource-select">
                <option value="">-- Choose a resource --</option>
            </select>

            <button id="request-btn" onclick="requestOTP()">Request Access</button>
        </div>

        <!-- State 2: Verify Screen -->
        <div id="verify-screen" class="hidden">
            <div class="greeting">Enter OTP sent to your Telegram</div>

            <div class="timer" id="timer">5:00</div>

            <label for="otp-input">OTP Code (6 digits):</label>
            <input type="text" id="otp-input" maxlength="6" placeholder="000000" pattern="[0-9]{6}">

            <button id="verify-btn" onclick="grantAccess()">Verify & Grant Access</button>
        </div>
    </div>

    <script>
        let resources = [];
        let selectedResourceId = null;
        let timerInterval = null;

        async function init() {
            try {
                const response = await fetch('/api/jit/resources');

                if (!response.ok) {
                    const error = await response.json();
                    showError(error.detail || 'Access denied');
                    document.getElementById('loading').classList.add('hidden');
                    return;
                }

                const data = await response.json();
                resources = data.resources;

                document.getElementById('greeting').textContent = `Hello, ${data.username}`;

                const select = document.getElementById('resource-select');
                resources.forEach(resource => {
                    const option = document.createElement('option');
                    option.value = resource.id;
                    option.textContent = resource.name;
                    select.appendChild(option);
                });

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('request-screen').classList.remove('hidden');

            } catch (error) {
                showError('Failed to load resources');
                document.getElementById('loading').classList.add('hidden');
            }
        }

        async function requestOTP() {
            const select = document.getElementById('resource-select');
            selectedResourceId = select.value;

            if (!selectedResourceId) {
                showError('Please select a resource');
                return;
            }

            const btn = document.getElementById('request-btn');
            btn.disabled = true;
            btn.textContent = 'Sending OTP...';

            try {
                const response = await fetch('/api/jit/request-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({resource_id: selectedResourceId})
                });

                if (!response.ok) {
                    const error = await response.json();
                    showError(error.detail || 'Failed to request OTP');
                    btn.disabled = false;
                    btn.textContent = 'Request Access';
                    return;
                }

                document.getElementById('request-screen').classList.add('hidden');
                document.getElementById('verify-screen').classList.remove('hidden');
                startTimer(300);

            } catch (error) {
                showError('Network error');
                btn.disabled = false;
                btn.textContent = 'Request Access';
            }
        }

        async function grantAccess() {
            const otpInput = document.getElementById('otp-input');
            const otpCode = otpInput.value;

            if (otpCode.length !== 6) {
                showError('Please enter 6-digit OTP');
                return;
            }

            const btn = document.getElementById('verify-btn');
            btn.disabled = true;
            btn.textContent = 'Verifying...';

            try {
                const response = await fetch('/api/jit/grant-access', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        resource_id: selectedResourceId,
                        otp_code: otpCode,
                        duration_minutes: 5
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    showError(error.detail || 'Failed to grant access');
                    btn.disabled = false;
                    btn.textContent = 'Verify & Grant Access';
                    return;
                }

                const data = await response.json();
                clearInterval(timerInterval);
                document.getElementById('verify-screen').classList.add('hidden');
                showSuccess(`✅ ${data.message}`);

            } catch (error) {
                showError('Network error');
                btn.disabled = false;
                btn.textContent = 'Verify & Grant Access';
            }
        }

        function startTimer(seconds) {
            let remaining = seconds;
            const timerEl = document.getElementById('timer');

            timerInterval = setInterval(() => {
                remaining--;
                const mins = Math.floor(remaining / 60);
                const secs = remaining % 60;
                timerEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;

                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    showError('OTP expired. Please request again.');
                }
            }, 1000);
        }

        function showError(message) {
            const errorEl = document.getElementById('error-alert');
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
            setTimeout(() => errorEl.classList.add('hidden'), 5000);
        }

        function showSuccess(message) {
            const successEl = document.getElementById('success-alert');
            successEl.textContent = message;
            successEl.classList.remove('hidden');
        }

        init();
    </script>
</body>
</html>
